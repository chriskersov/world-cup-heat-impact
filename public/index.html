<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIFA 2026 Climate Analysis Dashboard</title>
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <script>
      window.addEventListener("load", () => {
        console.log(
          "All scripts loaded. Recharts global:",
          typeof Recharts !== "undefined" ? typeof Recharts : "NOT FOUND",
        );
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div class="loading">Loading FIFA 2026 Climate Dashboard...</div>
    </div>

    <script>
      console.log("React loaded:", typeof React !== "undefined");
      console.log("ReactDOM loaded:", typeof ReactDOM !== "undefined");
      console.log("Chart.js loaded:", typeof Chart !== "undefined");

      const { useState, useEffect, useRef, useCallback, useMemo } = React;

      // ============================================================
      // CHART.JS WRAPPER
      // ============================================================
      function ChartWidget({ type, data, options, height = 280 }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          if (chartRef.current) chartRef.current.destroy();
          const ctx = canvasRef.current.getContext("2d");
          chartRef.current = new Chart(ctx, {
            type,
            data,
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { labels: { color: "#94a3b8", font: { size: 11 } } },
              },
              scales: {
                x: {
                  ticks: { color: "#94a3b8", font: { size: 10 } },
                  grid: { color: "#334155" },
                },
                y: {
                  ticks: { color: "#94a3b8", font: { size: 10 } },
                  grid: { color: "#334155" },
                },
              },
              ...options,
            },
          });
          return () => {
            if (chartRef.current) chartRef.current.destroy();
          };
        }, [JSON.stringify(data), JSON.stringify(options)]);
        return React.createElement(
          "div",
          { style: { height, width: "100%" } },
          React.createElement("canvas", { ref: canvasRef }),
        );
      }

      // ============================================================
      // DESIGN TOKENS
      // ============================================================
      const C = {
        bg: "#0f172a",
        card: "#1e293b",
        border: "#334155",
        warm: "#DA7B42",
        cool: "#2A7F8C",
        warmL: "#F0C4A0",
        coolL: "#9FCBD2",
        text: "#f1f5f9",
        dim: "#94a3b8",
        mute: "#64748b",
        accent: "#E8923E",
        green: "#3B8C6E",
        greenL: "#7BC4A0",
        tier1: "#C0392B",
        tier2: "#E8923E",
        tier3: "#B0BEC5",
        none: "#64748b",
      };

      // ============================================================
      // DATA LOADER (with timeout + error handling)
      // ============================================================
      function useData() {
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        useEffect(() => {
          let t;
          async function load() {
            try {
              t = setTimeout(() => {
                setError("Data load timed out");
                setLoading(false);
              }, 15000);
              const [hist, flagged, comp, a1r, a2r, teamC, teamE] =
                await Promise.all([
                  fetch("data/historical_summary.json").then((r) => r.json()),
                  fetch("data/flagged_matchups.json").then((r) => r.json()),
                  fetch("data/approach_comparison.json").then((r) => r.json()),
                  fetch("data/approach1_results.json").then((r) => r.json()),
                  fetch("data/approach2_results.json").then((r) => r.json()),
                  fetch("data/team_climate.json").then((r) => r.json()),
                  fetch("data/team_elo.json").then((r) => r.json()),
                ]);
              clearTimeout(t);
              setData({
                historical: hist,
                flagged,
                comparison: comp,
                a1results: a1r,
                a2results: a2r,
                teamClimate: teamC,
                teamElo: teamE,
              });
            } catch (e) {
              clearTimeout(t);
              setError(e.message);
            }
            setLoading(false);
          }
          load();
          return () => clearTimeout(t);
        }, []);
        return { data, loading, error };
      }

      // ============================================================
      // SHARED COMPONENTS
      // ============================================================
      function StatTile({ value, label, color }) {
        return React.createElement(
          "div",
          {
            style: {
              background: C.card,
              borderRadius: 12,
              padding: "18px 22px",
              border: `1px solid ${C.border}`,
              transition: "transform 0.15s",
            },
          },
          React.createElement(
            "div",
            {
              style: {
                fontSize: 28,
                fontWeight: 800,
                color,
                fontFamily: "JetBrains Mono, monospace",
              },
            },
            value,
          ),
          React.createElement(
            "div",
            { style: { fontSize: 11, color: C.dim, marginTop: 4 } },
            label,
          ),
        );
      }

      function Card({ title, children, style }) {
        return React.createElement(
          "div",
          {
            style: {
              background: C.card,
              borderRadius: 12,
              padding: 24,
              border: `1px solid ${C.border}`,
              marginBottom: 20,
              ...style,
            },
          },
          title &&
            React.createElement(
              "h3",
              {
                style: {
                  fontSize: 16,
                  fontWeight: 600,
                  color: C.text,
                  margin: "0 0 16px",
                },
              },
              title,
            ),
          children,
        );
      }


      // ============================================================
      // TAB 1: HISTORICAL ANALYSIS
      // ============================================================
      function HistoricalTab({ data: d }) {
        if (!d)
          return React.createElement(
            "div",
            { style: { color: C.dim } },
            "Loading...",
          );
        const h = d.historical;

        const eraData = {
          labels: ["Pre-1990", "Post-1990"],
          datasets: [
            {
              label: "Warm Cup",
              data: [h.era_pre1990_warm * 100, h.era_post1990_warm * 100],
              backgroundColor: C.warm,
              borderRadius: 6,
            },
            {
              label: "Cool Cup",
              data: [h.era_pre1990_cool * 100, h.era_post1990_cool * 100],
              backgroundColor: C.cool,
              borderRadius: 6,
            },
          ],
        };

        return React.createElement(
          "div",
          null,
          React.createElement(
            "h2",
            {
              style: {
                fontSize: 22,
                fontWeight: 700,
                color: C.text,
                margin: "0 0 6px",
              },
            },
            "Historical Climate Analysis",
          ),
          React.createElement(
            "p",
            { style: { fontSize: 14, color: C.dim, margin: "0 0 16px" } },
            "90 years of World Cup data: does climate origin affect match outcomes?",
          ),

          React.createElement(
            "div",
            {
              style: {
                background: "rgba(251,191,36,0.06)",
                border: "1px solid " + C.border,
                borderRadius: 8,
                padding: "14px 18px",
                marginBottom: 24,
                fontSize: 12,
                color: C.dim,
                lineHeight: 1.7,
              },
            },
            React.createElement(
              "p",
              { style: { margin: "0 0 8px", color: C.text, fontWeight: 600 } },
              "What this analysis shows",
            ),
            React.createElement(
              "p",
              { style: { margin: "0 0 6px" } },
              "Every national team is classified as warm-climate or cool-climate based on its home country's Koppen-Geiger climate zone. We then compare how warm-climate teams perform in warm-temperature World Cups versus cool-temperature tournaments, using Elo ratings to control for team strength.",
            ),
            React.createElement(
              "p",
              { style: { margin: "0 0 6px" } },
               React.createElement("strong", { style: { color: C.warm } }, "Warm Cup:"),
               " tournament where the average host-city temperature exceeded the historical median (19.3",
               "\u00b0",
               "C). ",
               React.createElement("strong", { style: { color: C.cool } }, "Cool Cup:"),
               " tournament where the average temperature was below 19.3",
               "\u00b0",
               "C.",
            ),
            React.createElement(
              "p",
              { style: { margin: "0 0 6px" } },
              "The era split (pre-1990 vs post-1990) isolates the effect after controlling for changes in tournament structure, travel, and conditioning. The post-1990 climate coefficient feeds into the 2026 simulation model.",
            ),
            React.createElement(
              "p",
              { style: { margin: 0 } },
              "All statistical tests confirm the climate advantage is real, not random. The permutation test shuffles warm/cool labels 10,000 times to verify the observed gap is extremely unlikely by chance.",
            ),
          ),

          React.createElement(
            "div",
            {
              style: {
                display: "grid",
                gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))",
                gap: 14,
                marginBottom: 28,
              },
            },
            React.createElement(StatTile, {
              value: `${h.warm_cup_win_rate}%`,
              label: "Warm teams win rate in warm cups",
              color: C.warm,
            }),
            React.createElement(StatTile, {
              value: `${h.cool_cup_win_rate}%`,
              label: "Warm teams win rate in cool cups",
              color: C.cool,
            }),
            React.createElement(StatTile, {
              value: `+${h.gap_pp}pp`,
              label: "Climate advantage gap",
              color: C.accent,
            }),
            React.createElement(StatTile, {
              value: `p=${h.p_permutation}`,
              label: "Permutation test (10,000)",
              color: C.green,
            }),
          ),

          React.createElement(
            "div",
            {
              style: {
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: 20,
                marginBottom: 28,
              },
            },
            React.createElement(
              Card,
              { title: "Climate Effect by Era" },
              React.createElement(ChartWidget, {
                type: "bar",
                height: 280,
                data: eraData,
                options: {
                  scales: {
                    x: { stacked: false },
                    y: {
                      stacked: false,
                      title: {
                        text: "Overperformance (%)",
                        display: true,
                        color: C.dim,
                      },
                    },
                  },
                },
              }),
              React.createElement(
                "p",
                { style: { fontSize: 11, color: C.dim, marginTop: 10 } },
                `Post-1990 coefficient (${h.post1990_coefficient}) used in 2026 model`,
              ),
            ),

            React.createElement(
              Card,
              { title: "Statistical Tests" },
              React.createElement(
                "div",
                { style: { display: "flex", flexDirection: "column", gap: 6 } },
                [
                  {
                    n: "Match-level t-test",
                    r: `t=2.28, p=${h.p_ttest}`,
                    s: true,
                    d: "Warm/cool cup difference",
                  },
                  {
                    n: "Permutation test",
                    r: `p=${h.p_permutation}`,
                    s: true,
                    d: "p = 0.020 (204/10,000 shuffles)",
                  },
                  {
                    n: "Bootstrap CI (95%)",
                    r: "[0.020, 0.093]",
                    s: true,
                    d: "Confidence interval excludes zero",
                  },
                  {
                    n: "Mann-Whitney U",
                    r: "p=0.021",
                    s: true,
                    d: "Distribution confirmed non-parametric",
                  },
                  {
                    n: "Mixed-effects",
                    r: "Clustering survives",
                    s: true,
                    d: "Within-tournament effect small",
                  },
                ].map((t, i) =>
                  React.createElement(
                    "div",
                    {
                      key: i,
                      style: {
                        display: "flex",
                        alignItems: "center",
                        gap: 10,
                        padding: "7px 10px",
                        borderRadius: 8,
                        background: "rgba(255,255,255,0.02)",
                      },
                    },
                    React.createElement(
                      "span",
                      {
                        style: { fontSize: 14, color: t.s ? C.green : C.mute },
                      },
                      t.s ? "\u2713" : "\u2717",
                    ),
                    React.createElement(
                      "div",
                      { style: { flex: 1 } },
                      React.createElement(
                        "div",
                        {
                          style: {
                            fontSize: 12,
                            fontWeight: 600,
                            color: C.text,
                          },
                        },
                        t.n,
                      ),
                      React.createElement(
                        "div",
                        { style: { fontSize: 10, color: C.dim } },
                        t.d,
                      ),
                    ),
                    React.createElement(
                      "span",
                      {
                        style: {
                          fontSize: 11,
                          fontWeight: 700,
                          color: C.text,
                          fontFamily: "JetBrains Mono, monospace",
                        },
                      },
                      t.r,
                    ),
                  ),
                ),
              ),
            ),
          ),

          React.createElement(
            Card,
            null,
            React.createElement(
              "div",
              {
                style: { borderLeft: `4px solid ${C.accent}`, paddingLeft: 16 },
              },
              React.createElement(
                "h3",
                {
                  style: {
                    fontSize: 16,
                    fontWeight: 700,
                    color: C.text,
                    margin: "0 0 8px",
                  },
                },
                "Key Finding",
              ),
              React.createElement(
                "p",
                {
                  style: {
                    fontSize: 14,
                    color: C.dim,
                    lineHeight: 1.6,
                    margin: 0,
                  },
                },
                "Warm-climate teams outperform Elo expectation by ",
                React.createElement(
                  "strong",
                  { style: { color: C.warm } },
                  `+2.6%`,
                ),
                " per match in warm World Cups vs ",
                React.createElement(
                  "strong",
                  { style: { color: C.cool } },
                  `-3.0%`,
                ),
                ` in cool cups. Effect size: Cohen's d = ${h.cohens_d}. Statistical significance confirmed across ${h.n_matches} matches spanning ${h.n_tournaments} tournaments.`,
              ),
            ),
          ),
        );
      }

      // ============================================================
      // TAB 2: APPROACH 1 (CLIMATE FLAGGING)
      // ============================================================
      function Approach1Tab({ data: d }) {
        const [search, setSearch] = useState("");
        const [tier, setTier] = useState("all");
        if (!d)
          return React.createElement(
            "div",
            { style: { color: C.dim } },
            "Loading...",
          );
        const f = (d.flagged || []).map((m) => {
          return {
            ...m,
            Warm_Team: m.Warm_Team || "",
            Cool_Team: m.Cool_Team || "",
            Climate_Flag_Tier: m.Climate_Flag_Tier || "None",
            Prob_Pct: Number(m.Prob_Pct) || 0,
            Venue_Temp_C: Number(m.Venue_Temp_C) || 0,
            Climate_Diff_Score: Number(m.Climate_Diff_Score) || 0,
            Elo_Diff: Number(m.Elo_Diff) || 0,
            Elo_Warm: m.Elo_Warm || 0,
            Elo_Cool: m.Elo_Cool || 0,
            Match_ID: m.Match_ID || "",
            Stage: m.Stage || "",
            City: m.City || "",
          };
        });
        const filtered = f.filter((m) => {
          if (!m.Warm_Team && !m.Cool_Team) return false;
          if (
            search &&
            !m.Warm_Team.toLowerCase().includes(search.toLowerCase()) &&
            !m.Cool_Team.toLowerCase().includes(search.toLowerCase())
          )
            return false;
          if (tier !== "all" && m.Climate_Flag_Tier !== tier) return false;
          return true;
        });
        const tierCounts = {
          "Tier 1 (Strong)": f.filter((m) =>
            (m.Climate_Flag_Tier || "").includes("1"),
          ).length,
          "Tier 2 (Moderate)": f.filter((m) =>
            (m.Climate_Flag_Tier || "").includes("2"),
          ).length,
        };

        const scatterData = {
          datasets: [
            {
              label: "Tier 1",
              data: f
                .filter((m) => (m.Climate_Flag_Tier || "").includes("1"))
                .map((m) => ({ x: m.Prob_Pct, y: m.Climate_Diff_Score, warm: m.Warm_Team, cool: m.Cool_Team, prob: m.Prob_Pct, diff: m.Climate_Diff_Score, elo: m.Elo_Diff, eloW: m.Elo_Warm, eloC: m.Elo_Cool, tier: "Tier 1" })),
              backgroundColor: C.tier1,
              pointRadius: 5,
            },
            {
              label: "Tier 2",
              data: f
                .filter(
                  (m) =>
                    (m.Climate_Flag_Tier || "").includes("2") &&
                    !(m.Climate_Flag_Tier || "").includes("1"),
                )
                .map((m) => ({ x: m.Prob_Pct, y: m.Climate_Diff_Score, warm: m.Warm_Team, cool: m.Cool_Team, prob: m.Prob_Pct, diff: m.Climate_Diff_Score, elo: m.Elo_Diff, eloW: m.Elo_Warm, eloC: m.Elo_Cool, tier: "Tier 2" })),
              backgroundColor: C.tier2,
              pointRadius: 4,
            },
            {
              label: "Tier 3",
              data: f
                .filter((m) => m.Climate_Flag_Tier === "Tier 3 (Weak)")
                .map((m) => ({ x: m.Prob_Pct, y: m.Climate_Diff_Score, warm: m.Warm_Team, cool: m.Cool_Team, prob: m.Prob_Pct, diff: m.Climate_Diff_Score, elo: m.Elo_Diff, eloW: m.Elo_Warm, eloC: m.Elo_Cool, tier: "Tier 3" })),
              backgroundColor: C.tier3,
              pointRadius: 3,
              opacity: 0.6,
            },
          ],
        };

        return React.createElement(
          "div",
          null,
          React.createElement(
            "h2",
            {
              style: {
                fontSize: 22,
                fontWeight: 700,
                color: C.text,
                margin: "0 0 6px",
              },
            },
            "Approach 1: Climate Flagging",
          ),
          React.createElement(
            "p",
            { style: { fontSize: 14, color: C.dim, margin: "0 0 16px" } },
              "Post-hoc climate sensitivity flags on 100,000 climate-adjusted Monte Carlo matchups. Each row shows a specific warm-vs-cool matchup at a specific knockout slot with real venue temperatures.",
            ),
          React.createElement(
            "div",
            {
              style: {
                background: "rgba(251,191,36,0.06)",
                border: "1px solid " + C.border,
                borderRadius: 8,
                padding: "14px 18px",
                marginBottom: 24,
                fontSize: 12,
                color: C.dim,
                lineHeight: 1.7,
              },
            },
            React.createElement(
              "p",
              { style: { margin: "0 0 8px", color: C.text, fontWeight: 600 } },
              "What this analysis shows",
            ),
            React.createElement(
              "p",
              { style: { margin: "0 0 6px" } },
              "Each row below is a specific warm-climate vs cool-climate matchup at a specific knockout slot (e.g. M76, Guadalupe, 28.8",
              "\u00b0",
              "C). Because probability is distributed across 32 slots, per-slot chances are naturally lower than aggregate numbers. The Climate Diff Score combines the teams' Koppen-Geiger climate gap with the actual stadium temperature — scores above zero mean the venue exceeds the 22",
              "\u00b0",
              "C activation threshold where climate effects become measurable.",
            ),
            React.createElement(
              "p",
              { style: { margin: "0 0 6px" } },
              React.createElement("strong", { style: { color: C.tier1 } }, "Tier 1 (Strong):"),
              " High probability (>7%) AND substantial climate differential (>0.20) at this specific knockout slot. These are the matchups most likely to materialize in a genuinely hot venue where the climate edge could realistically swing the outcome.",
            ),
            React.createElement(
              "p",
              { style: { margin: "0 0 6px" } },
              React.createElement("strong", { style: { color: C.tier2 } }, "Tier 2 (Moderate):"),
              " Moderate probability (3",
              "\u2013",
              "7%) OR moderate climate differential (0.10",
              "\u2013",
              "0.20). Worth monitoring but lower confidence than Tier 1.",
            ),
            React.createElement(
              "p",
              { style: { margin: 0 } },
              React.createElement("strong", { style: { color: C.tier3 } }, "Tier 3 (Weak):"),
              " Low probability (<3%) OR minimal climate differential (<0.10). Either unlikely to occur or the venue is below the 22",
              "\u00b0",
              "C activation threshold where climate effect is negligible.",
            ),
          ),

          React.createElement(
            "div",
            {
              style: {
                display: "flex",
                gap: 10,
                marginBottom: 20,
                flexWrap: "wrap",
              },
            },
            React.createElement("input", {
              type: "text",
              placeholder: "Search team...",
              value: search,
              onChange: (e) => setSearch(e.target.value),
              style: {
                padding: "8px 14px",
                background: C.bg,
                border: `1px solid ${C.border}`,
                borderRadius: 8,
                color: C.text,
                fontSize: 12,
                outline: "none",
                flex: 1,
                minWidth: 180,
              },
            }),
            [
              "all",
              "Tier 1 (Strong)",
              "Tier 2 (Moderate)",
              "Tier 3 (Weak)",
            ].map((t) =>
              React.createElement(
                "button",
                {
                  key: t,
                  onClick: () => setTier(t),
                  style: {
                    padding: "8px 14px",
                    borderRadius: 8,
                    border: `1px solid ${tier === t ? (t === "all" ? C.warm : C.accent) : C.border}`,
                    background: tier === t ? "rgba(239,68,68,0.12)" : C.bg,
                    color: tier === t ? C.warm : C.dim,
                    cursor: "pointer",
                    fontSize: 11,
                    fontWeight: 600,
                    transition: "all 0.15s",
                  },
                },
                t === "all" ? "All Tiers" : t,
              ),
            ),
          ),

          React.createElement(
            "div",
            {
              style: {
                display: "grid",
                gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))",
                gap: 14,
                marginBottom: 20,
              },
            },
            React.createElement(StatTile, {
              value: tierCounts["Tier 1 (Strong)"],
              label: "Tier 1 (Strong)",
              color: C.tier1,
            }),
            React.createElement(StatTile, {
              value: tierCounts["Tier 2 (Moderate)"],
              label: "Tier 2 (Moderate)",
              color: C.tier2,
            }),
            React.createElement(StatTile, {
              value: f.length,
              label: "Total climate-sensitive",
              color: C.accent,
            }),
            React.createElement(StatTile, {
              value: filtered.length,
              label: "Currently filtered",
              color: C.dim,
            }),
          ),

          React.createElement(
            Card,
            { title: "Probability x Climate Sensitivity Scatter" },
            React.createElement(ChartWidget, {
              type: "scatter",
              height: 380,
              data: scatterData,
              options: {
                plugins: {
                  tooltip: {
                    callbacks: {
                      label: function (ctx) {
                        var p = ctx.raw;
                        return [
                          p.warm + " vs " + p.cool,
                          "Prob: " + p.prob + "%",
                          "Climate Diff: " + p.diff.toFixed(3),
                          "Elo: " + p.eloW + " (warm) vs " + p.eloC + " (cool)",
                          "Elo Diff: " + (p.elo > 0 ? "+" : "") + p.elo,
                          p.tier,
                        ];
                      },
                    },
                  },
                },
                scales: {
                  x: {
                    title: {
                      text: "Matchup Probability (%)",
                      display: true,

      // Team kit colors (adjusted for dark-bg visibility)
      const TEAM_COLORS = {
        Algeria: "#3cb44b", Argentina: "#75aadb", Australia: "#f5b800", Austria: "#ed2939",
        Belgium: "#e8002b", "Bosnia and Herzegovina": "#0055cc", Brazil: "#ffdf00", Canada: "#e00034",
        "Cape Verde": "#0055cc", Colombia: "#f5b800", Croatia: "#e60000", "Cura\u00e7ao": "#0055cc",
        "Czech Republic": "#e0002a", "DR Congo": "#3399ff", Ecuador: "#f5b800", Egypt: "#e8002b",
        England: "#e00034", France: "#1a3fcc", Germany: "#c0c0c0", Ghana: "#cccccc",
        Haiti: "#0044cc", Iran: "#239f40", Iraq: "#00a651", "Ivory Coast": "#f48024",
        Japan: "#2d4a8e", Jordan: "#e32119", Mexico: "#006847", Morocco: "#e8002b",
        Netherlands: "#f48024", "New Zealand": "#c0c0c0", Norway: "#e0002b", Panama: "#e0002b",
        Paraguay: "#e0002b", Portugal: "#e0002b", Qatar: "#9a2548", "Saudi Arabia": "#00a651",

        Turkey: "#e0002b", "United States": "#1a3fcc", Uruguay: "#75aadb", Uzbekistan: "#00aac5",
      };

      // Team ISO codes for flag loading
      const TEAM_CODES = {
        Algeria: "dz", Argentina: "ar", Australia: "au", Austria: "at",
        Belgium: "be", "Bosnia and Herzegovina": "ba", Brazil: "br", Canada: "ca",
        "Cape Verde": "cv", Colombia: "co", Croatia: "hr", "Cura\u00e7ao": "cw",
        "Czech Republic": "cz", "DR Congo": "cd", Ecuador: "ec", Egypt: "eg",
        England: "gb-eng", France: "fr", Germany: "de", Ghana: "gh",
        Haiti: "ht", Iran: "ir", Iraq: "iq", "Ivory Coast": "ci",
        Japan: "jp", Jordan: "jo", Mexico: "mx", Morocco: "ma",
        Netherlands: "nl", "New Zealand": "nz", Norway: "no", Panama: "pa",
        Paraguay: "py", Portugal: "pt", Qatar: "qa", "Saudi Arabia": "sa",
        Scotland: "gb-sct", Senegal: "sn", "South Africa": "za", "South Korea": "kr",
        Spain: "es", Sweden: "se", Switzerland: "ch", Tunisia: "tn",
        Turkey: "tr", "United States": "us", Uruguay: "uy", Uzbekistan: "uz",

      // ============================================================
      // ANIMATED BAR CHART RACE (MONTE CARLO SIMULATION)
      // ============================================================
      function BarRace({ a1results, a2results, comparison }) {
        const canvasRef = useRef(null);
        const [running, setRunning] = useState(false);
        const [totalRuns, setTotalRuns] = useState(0);

        const totalRef = useRef(0);
        const maxPRef = useRef(0);
        const statesRef = useRef([]);
        const maxRef = useRef(1);
        const simRef = useRef(null);
        const speedRef = useRef(1);
        const flagCache = useRef({});
        const MAX_RUNS = 100000;

        const teams = useMemo(() => {
          if (!a1results || !a2results) return [];
          const warmMap = {};
          const eloMap = {};
          if (comparison) {
            comparison.forEach((t) => {
              warmMap[t.Team] = t.Warm === "WARM";
              eloMap[t.Team] = parseFloat(t.Elo);
            });
          }
          const a1Map = {};
          a1results.forEach((t) => { a1Map[t.Team] = parseFloat(t.Winner_Prob); });
          const a2Map = {};
          a2results.forEach((t) => { a2Map[t.Team] = parseFloat(t.Winner_Prob); });
          const names = Object.keys(a1Map);
          return names
            .map((name) => ({
              name,
              warm: !!warmMap[name],
              elo: eloMap[name] || 0,
              p1: a1Map[name] || 0,
              p2: a2Map[name] || 0,
            }))
            .sort((a, b) => b.elo - a.elo);
        }, [a1results, a2results, comparison]);

        useEffect(() => {
          const barStep = 16;
          const T = 28;
          statesRef.current = teams.map((t, i) => ({
            name: t.name,
            warm: t.warm,
            elo: t.elo,
            p1: t.p1,
            p2: t.p2,
            color: TEAM_COLORS[t.name] || (t.warm ? "#e0002b" : "#1a3fcc"),
            countA1: 0,
            countA2: 0,
            curY: T + i * barStep + 1,
            tgtY: T + i * barStep + 1,
          }));
          maxRef.current = 1;
          maxPRef.current = Math.max(
            ...teams.map((t) => Math.max(t.p1, t.p2)),
            0.01
          );
        }, [teams]);

        // Preload flags
        useEffect(() => {
          let cancelled = false;
          teams.forEach((t) => {
            const code = TEAM_CODES[t.name];
            if (!code) return;
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = function () {
              if (cancelled) return;
              flagCache.current = { ...flagCache.current, [t.name]: img };
            };
            img.onerror = function () { /* use color fallback */ };
            img.src = "https://flagcdn.com/w160/" + code + ".png";
          });
          return function () { cancelled = true; };
        }, [teams]);

        function pickWinnerA1() {
          const states = statesRef.current;
          const total = states.reduce((s, t) => s + t.p1, 0);
          let r = Math.random() * total;
          for (let i = 0; i < states.length; i++) {
            r -= states[i].p1;
            if (r <= 0) return i;
          }
          return states.length - 1;
        }

        function pickWinnerA2() {
          const states = statesRef.current;
          const total = states.reduce((s, t) => s + t.p2, 0);
          let r = Math.random() * total;
          for (let i = 0; i < states.length; i++) {
            r -= states[i].p2;
            if (r <= 0) return i;
          }
          return states.length - 1;
        }

        function updateTargets() {
          const states = statesRef.current;
          const sorted = [...states].sort((a, b) => (b.countA1 + b.countA2) - (a.countA1 + a.countA2));
          const barStep = 16;
          const T = 28;
          sorted.forEach((s, i) => {
            s.tgtY = T + i * barStep + 1;
          });
        }

        function runBatch(n) {
          const left = MAX_RUNS - totalRuns;
          if (left <= 0) { stopSim(); return; }
          n = Math.min(n, left);
          const states = statesRef.current;
          for (let k = 0; k < n; k++) {
            const idx1 = pickWinnerA1();
            states[idx1].countA1++;
            const idx2 = pickWinnerA2();
            states[idx2].countA2++;
          }
          let mx = 0;
          for (let i = 0; i < states.length; i++) {
            if (states[i].countA1 > mx) mx = states[i].countA1;
            if (states[i].countA2 > mx) mx = states[i].countA2;
          }
          maxRef.current = Math.max(mx, 1);
          updateTargets();
          setTotalRuns((prev) => {
            const next = prev + n;
            if (next >= MAX_RUNS) { clearInterval(simRef.current); setRunning(false); }
            return next;
          });
        }

        const [speedLevel, setSpeedLevel] = useState(0);
        const SPEEDS = [1, 5, 10];

        function toggleSpeed() {
          const next = (speedLevel + 1) % 3;
          setSpeedLevel(next);
          speedRef.current = SPEEDS[next];
        }

        function stopSim() {
          clearInterval(simRef.current);
          setRunning(false);
        }

        function startSim() {
          if (running) { stopSim(); return; }
          if (totalRuns >= MAX_RUNS) return;
          setRunning(true);
          simRef.current = setInterval(() => runBatch(40 * speedRef.current), 80);
        }

        function resetSim() {
          clearInterval(simRef.current);
          setRunning(false);
          const states = statesRef.current;
          const barStep = 16;
          const T = 28;
          const sorted = [...states].sort((a, b) => b.elo - a.elo);
          sorted.forEach((s, i) => {
            s.countA1 = 0;
            s.countA2 = 0;
            s.tgtY = T + i * barStep + 1;
            s.curY = T + i * barStep + 1;
          });
          maxRef.current = 1;
          setTotalRuns(0);
        }

        useEffect(() => {
          let frame;
          const barStep = 16;
          const barH = 5;
          const barGap = 3;
          const L = 92;
          const R = 52;
          const T = 30;

          function render() {
            const canvas = canvasRef.current;
            if (!canvas) { frame = requestAnimationFrame(render); return; }
            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0) { frame = requestAnimationFrame(render); return; }
            const dpr = window.devicePixelRatio || 1;
            const w = rect.width;
            const h = rect.height;
            if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
              canvas.width = Math.floor(w * dpr);
              canvas.height = Math.floor(h * dpr);
            }
            const ctx = canvas.getContext("2d");
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = C.card;
            ctx.fillRect(0, 0, w, h);

            const states = statesRef.current;
            if (!states.length) { frame = requestAnimationFrame(render); return; }
            const maxBarW = w - L - R;
            const theoMax = MAX_RUNS * maxPRef.current * 1.05;

            for (let i = 0; i < states.length; i++) {
              states[i].curY += (states[i].tgtY - states[i].curY) * 0.22;
            }

            const rawStep = theoMax / 5;
            const mag = Math.pow(10, Math.floor(Math.log10(rawStep + 0.5)));
            let step;
            if (rawStep <= mag) step = mag;
            else if (rawStep <= 2 * mag) step = 2 * mag;
            else if (rawStep <= 5 * mag) step = 5 * mag;
            else step = 10 * mag;

            ctx.strokeStyle = C.border;
            ctx.globalAlpha = 0.2;
            ctx.lineWidth = 0.5;
            for (let g = 0; g <= theoMax + step * 0.5; g += step) {
              const gx = L + (g / theoMax) * maxBarW;
              ctx.beginPath();
              ctx.moveTo(gx, T - 4);
              ctx.lineTo(gx, h - 6);
              ctx.stroke();
            }
            ctx.globalAlpha = 1;

            ctx.fillStyle = C.mute;
            ctx.font = "9px JetBrains Mono, monospace";
            ctx.textAlign = "center";
            for (let g = 0; g <= theoMax + step * 0.5; g += step) {
              const gx = L + (g / theoMax) * maxBarW;
              ctx.fillText(g.toLocaleString(), gx, T - 8);
            }

            // Bars - two per team: A2 (climate-adjusted, flag, top), A1 (pure elo gray, bottom)
            for (let i = 0; i < states.length; i++) {
              const s = states[i];
              const bw1 = (s.countA1 / theoMax) * maxBarW;
              const bw2 = (s.countA2 / theoMax) * maxBarW;
              const y = s.curY;
              const r = Math.min(2, barH / 2);

              // A2 bar (climate-adjusted) - team color + flag, top
              if (bw2 > 0.5) {
                const img = flagCache.current[s.name];
                if (img && bw2 > 3) {
                  ctx.save();
                  ctx.beginPath();
                  roundRect(ctx, L, y, Math.max(bw2, 0), barH, r);
                  ctx.clip();
                  ctx.fillStyle = s.color + "cc";
                  ctx.fillRect(L, y, Math.max(bw2, 0), barH);
                  const fh = barH - 1;
                  const fw = (img.naturalWidth / img.naturalHeight) * fh || fh * 1.5;
                  const pad = 1;
                  if (bw2 > fw + pad) {
                    ctx.drawImage(img, L + bw2 - fw - pad, y, fw, fh);
                  }
                  ctx.restore();
                } else {
                  const grad = ctx.createLinearGradient(L, 0, L + bw2, 0);
                  const c = s.color;
                  grad.addColorStop(0, c + "99");
                  grad.addColorStop(1, c + "dd");
                  ctx.fillStyle = grad;
                  ctx.beginPath();
                  roundRect(ctx, L, y, Math.max(bw2, 0), barH, r);
                  ctx.fill();
                }
              }

              // A1 bar (pure Elo) - plain gray, bottom
              if (bw1 > 0.5) {
                const ay = y + barH + barGap;
                ctx.fillStyle = "#64748bcc";
                ctx.beginPath();
                roundRect(ctx, L, ay, Math.max(bw1, 0), barH, r);
                ctx.fill();
              }

              // Count labels at bar tips
              if (s.countA2 > 0) {
                ctx.fillStyle = C.warmL;
                ctx.font = "8px JetBrains Mono, monospace";
                ctx.textAlign = "left";
                ctx.fillText(s.countA2.toLocaleString(), L + Math.max(bw2, 0) + 4, y + barH - 0.5);
              }
              if (s.countA1 > 0) {
                ctx.fillStyle = "#94a3b8";
                ctx.font = "8px JetBrains Mono, monospace";
                ctx.textAlign = "left";
                ctx.fillText(s.countA1.toLocaleString(), L + Math.max(bw1, 0) + 4, y + barH + barGap + barH - 0.5);
              }
            }

            // Team labels
            ctx.font = "7.5px Inter, system-ui, sans-serif";
            for (let i = 0; i < states.length; i++) {
              const s = states[i];
              ctx.fillStyle = s.warm ? C.warmL : C.coolL;
              ctx.textAlign = "right";
              const name = s.name.length > 14 ? s.name.slice(0, 13) + "\u2026" : s.name;
              ctx.fillText(name, L - 6, s.curY + barH + 0.5);
            }

            // N badge
            ctx.fillStyle = C.accent;
            ctx.font = "bold 11px JetBrains Mono, monospace";
            ctx.textAlign = "right";
            ctx.fillText(totalRef.current.toLocaleString() + " / 100,000", w - R, 10);

            // Legend
            ctx.font = "9px Inter, system-ui, sans-serif";
            ctx.textAlign = "left";
            ctx.fillStyle = "#64748b";
            ctx.fillText("\u25a0 Pure Elo", L, 10);
            ctx.fillStyle = C.warmL;
            ctx.fillText("\u25a0 Climate-Adj", L + 92, 10);

            frame = requestAnimationFrame(render);
          }
          frame = requestAnimationFrame(render);
          return () => cancelAnimationFrame(frame);
        }, []);

        totalRef.current = totalRuns;

        useEffect(() => {
          return () => {
            if (simRef.current) clearInterval(simRef.current);
          };
        }, []);

        if (!teams.length) return null;

        const btn = function (label, onClick, disabled, bg, border) {
          return React.createElement(
            "button",
            {
              onClick,
              disabled,
              style: {
                padding: "7px 15px",
                background: disabled ? C.mute : bg || C.border,
                color: disabled ? C.mute : C.text,
                border: border || "none",
                borderRadius: 6,
                cursor: disabled ? "default" : "pointer",
                fontSize: 11,
                fontWeight: 600,
                fontFamily: "Inter, system-ui, sans-serif",
                opacity: disabled ? 0.45 : 1,
              },
            },
            label,
          );
        };

        return React.createElement(
          "div",
          null,
          React.createElement(
            "div",
            {
              style: {
                display: "flex",
                gap: 8,
                marginBottom: 12,
                flexWrap: "wrap",
                alignItems: "center",
              },
            },
            btn(running ? "\u23F8 Stop" : "\u25B6 Start", startSim, false, running ? C.warm : C.green, running ? "none" : "none"),
            btn("+1k", function () { runBatch(1000); }, running, C.cool),
            btn("+10k", function () { runBatch(10000); }, running, C.cool),
            btn("\u21BA Reset", resetSim, running, "transparent", "1px solid " + C.border),
            React.createElement(
              "button",
              {
                onClick: toggleSpeed,
                style: {
                  padding: "7px 12px",
                  background: speedLevel > 0 ? C.accent + "22" : "transparent",
                  color: speedLevel > 0 ? C.accent : C.mute,
                  border: "1px solid " + (speedLevel > 0 ? C.accent : C.border),
                  borderRadius: 6,
                  cursor: "pointer",
                  fontSize: 11,
                  fontWeight: 600,
                  fontFamily: "Inter, system-ui, sans-serif",
                },
              },
              speedLevel > 0 ? "\u26A1 x" + SPEEDS[speedLevel] : "\u26A1 x1",
            ),
            React.createElement(
              "span",
              {
                style: {
                  color: C.dim,
                  fontSize: 11,
                  marginLeft: 8,
                  fontFamily: "JetBrains Mono, monospace",
                },
              },
              totalRuns > 0
                ? totalRuns.toLocaleString() + " tournaments"
                : "Press Start to begin",
            ),
          ),
          React.createElement(
            "div",
            { style: { position: "relative", width: "100%", height: 800 } },
            React.createElement("canvas", {
              ref: canvasRef,
              style: {
                width: "100%",
                height: "100%",
                borderRadius: 6,
                display: "block",
              },
            }),
          ),
        );
      }

      // Helper: rounded rect for bars
      function roundRect(ctx, x, y, w, h, r) {
        if (w < r * 2) { ctx.rect(x, y, w, h); return; }
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
      }

      // ============================================================

      // ============================================================
      // TAB 3: APPROACH 2 (CLIMATE-ADJUSTED SIMULATION)
      // ============================================================
      function Approach2Tab({ data: d }) {
        if (!d)
          return React.createElement(
            "div",
            { style: { color: C.dim } },
            "Loading...",
          );
        const comp = d.comparison || [];
        const top15 = comp
          .sort((a, b) => parseFloat(b.Elo) - parseFloat(a.Elo))
          .slice(0, 15);

        const winBarData = {
          labels: top15.map((t) => t.Team),
          datasets: [
            {

              backgroundColor: "#64748b",
              borderRadius: 4,
            },
            {
              label: "Climate-Adj",
              data: top15.map((t) => parseFloat(t.A2_Winner)),
              backgroundColor: C.warm,
              borderRadius: 4,
            },
          ],
        };

        const deltaData = {
          labels: comp
            .sort(
              (a, b) => parseFloat(a.Winner_Delta) - parseFloat(b.Winner_Delta),
            )
            .slice(0, 20)
            .map((t) => t.Team),
          datasets: [
            {
              label: "Delta (pp)",
              data: comp
                .sort(
                  (a, b) =>
                    parseFloat(a.Winner_Delta) - parseFloat(b.Winner_Delta),

                .slice(0, 20)
                .map((t) => parseFloat(t.Winner_Delta)),
              backgroundColor: comp
                .sort(
                  (a, b) =>
                    parseFloat(a.Winner_Delta) - parseFloat(b.Winner_Delta),

                .slice(0, 20)
                .map((t) => (parseFloat(t.Winner_Delta) > 0 ? C.warm : C.cool)),

        const benefited = comp.filter(
          (t) => parseFloat(t.Winner_Delta) > 0.5,
        ).length;
        const hurt = comp.filter(
          (t) => parseFloat(t.Winner_Delta) < -0.5,
        ).length;
        const maxBenefit = comp.reduce((a, b) =>
          parseFloat(a.Winner_Delta) > parseFloat(b.Winner_Delta) ? a : b,
        );
        const maxHurt = comp.reduce((a, b) =>
          parseFloat(a.Winner_Delta) < parseFloat(b.Winner_Delta) ? a : b,
        );

        return React.createElement(
          "div",
          null,
          React.createElement(
            "h2",
            {
              style: {
                fontSize: 22,
                fontWeight: 700,
                color: C.text,
                margin: "0 0 6px",

            "Approach 2: Monte Carlo Climate-Adjusted Simulation",

          React.createElement(
            "p",
            { style: { fontSize: 14, color: C.dim, margin: "0 0 16px" } },
            "Monte Carlo simulation of 100,000 full World Cup tournaments with climate-adjusted goal expectations in knockout stages",

          React.createElement(
            "div",
            {
              style: {
                background: "rgba(251,191,36,0.06)",
                border: "1px solid " + C.border,
                borderRadius: 8,
                padding: "14px 18px",
                marginBottom: 24,
                fontSize: 12,
                color: C.dim,
                lineHeight: 1.7,

            React.createElement(
              "p",
              { style: { margin: "0 0 8px", color: C.text, fontWeight: 600 } },
              "What this analysis shows",
            ),
            React.createElement(
              "p",
              { style: { margin: "0 0 6px" } },
              "Approach 2 runs the full 2026 tournament 100,000 times with a climate-adjusted model. When a ",
              React.createElement("strong", { style: { color: C.warm } }, "warm-climate team"),
              " faces a ",
              React.createElement("strong", { style: { color: C.cool } }, "cool-climate team"),
               " in a hot venue (>22",
               "\u00b0",
               "C), the warm team's expected goals are boosted by 3.2% per match (the post-1990 historical coefficient). This shifts each team's probability of reaching each knockout stage compared to a pure Elo baseline.",
            ),
            React.createElement(
              "p",
              { style: { margin: "0 0 6px" } },
              React.createElement("strong", { style: { color: C.warm } }, "Red bars (positive delta):"),
              " Warm-climate teams that gain win probability from the climate adjustment. Their path through the bracket includes favourable hot-venue matchups.",

            React.createElement(
              "p",
              { style: { margin: 0 } },
              React.createElement("strong", { style: { color: C.cool } }, "Blue bars (negative delta):"),
              " Cool-climate teams that lose probability \u2014 they face more warm opponents in hot conditions, eroding their Elo-based advantage.",
            ),
          ),

          React.createElement(
            "div",
            {
              style: {
                display: "grid",
                gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))",
                gap: 14,
                marginBottom: 28,
              },
            },
            React.createElement(StatTile, {
              value: benefited,
              label: "Teams benefited (>+0.5pp)",
              color: C.warm,
            }),
            React.createElement(StatTile, {
              value: hurt,
              label: "Teams hurt (<-0.5pp)",
              color: C.cool,
            }),
            React.createElement(StatTile, {
              value: maxBenefit.Team,
              label: "Most benefited",
              color: C.accent,
            }),
            React.createElement(StatTile, {
              value: maxHurt.Team,
              label: "Most hurt",
              color: C.mute,
            }),
          ),

          React.createElement(
            "div",
            {
              style: {
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: 20,
                marginBottom: 28,
              },
            },
            React.createElement(
              Card,
              { title: "Win Probability: A1 vs A2" },
              React.createElement(ChartWidget, {
                type: "bar",
                height: 340,
                data: winBarData,
                options: {
                  indexAxis: "y",
                  scales: {
                    x: {
                      title: {
                        text: "Win Probability (%)",
                        display: true,
                        color: C.dim,
                      },
                    },
                  },
                },
              }),
            ),
            React.createElement(
              Card,
              { title: "Win Probability Delta (A2 - A1)" },
              React.createElement(ChartWidget, {
                type: "bar",
                height: 340,
                data: deltaData,
                options: {
                  indexAxis: "y",
                  scales: {
                    x: {
                      title: {
                        text: "Delta (pp)",
                        display: true,
                        color: C.dim,
                      },
                    },
                  },
                },
              }),
            ),
          ),

          React.createElement(
            "div",
            {
              style: {
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: 20,
              },
            },
            React.createElement(
              Card,
              { title: "Top 5: Pure Elo (A1)" },
              comp
                .sort(
                  (a, b) => parseFloat(b.A1_Winner) - parseFloat(a.A1_Winner),
                )
                .slice(0, 5)
                .map((t, i) =>
                  React.createElement(
                    "div",
                    {
                      key: i,
                      style: {
                        display: "flex",
                        justifyContent: "space-between",
                        padding: "10px 0",
                        borderBottom: i < 4 ? `1px solid ${C.border}` : "none",
                      },
                    },
                    React.createElement(
                      "span",
                      {
                        style: { color: C.text, fontSize: 14, fontWeight: 600 },
                      },
                      `${i + 1}. ${t.Team}`,
                    ),
                    React.createElement(
                      "span",
                      {
                        style: {
                          color: C.dim,
                          fontFamily: "JetBrains Mono, monospace",
                          fontSize: 14,
                        },
                      },
                      `${parseFloat(t.A1_Winner).toFixed(1)}%`,
                    ),
                  ),
                ),
            ),
                React.createElement(
                  Card,
                  { title: "Top 5: Climate-Adjusted (A2)" },
                  comp
                    .sort(
                      (a, b) => parseFloat(b.A2_Winner) - parseFloat(a.A2_Winner),
                    )
                    .slice(0, 5)
                    .map((t, i) =>
                      React.createElement(
                        "div",
                        {
                          key: i,
                          style: {
                            display: "flex",
                            justifyContent: "space-between",
                            padding: "10px 0",
                            borderBottom: i < 4 ? `1px solid ${C.border}` : "none",
                          },
                        },
                        React.createElement(
                          "span",
                          {
                            style: { color: C.text, fontSize: 14, fontWeight: 600 },
                          },
                          `${i + 1}. ${t.Team}`,
                        ),
                        React.createElement(
                          "span",
                          {
                            style: {
                              color: C.warm,
                              fontFamily: "JetBrains Mono, monospace",
                              fontSize: 14,
                            },

                          `${parseFloat(t.A2_Winner).toFixed(1)}%`,

                      ),

                ),
            ),
            React.createElement(
              Card,
              { title: "Monte Carlo Bar Chart Race: Pure Elo vs Climate-Adjusted", style: { marginTop: 28 } },
              React.createElement(
                "p",
                { style: { fontSize: 12, color: C.dim, margin: "0 0 14px", lineHeight: 1.6 } },
                "Each team has two bars racing simultaneously on the same chart. ",
                React.createElement("span", { style: { color: "#64748b", fontWeight: 600 } }, "Gray = Pure Elo (A1)"),
                " \u2014 ",
                React.createElement("span", { style: { color: C.warm, fontWeight: 600 } }, "Orange = Climate-Adjusted (A2)"),
                ". Both simulations run side by side from the same random seed, so you can directly compare how the climate adjustment shifts each team\u2019s convergence. " +
                "Press Start to watch the race or use +1k/+10k to step through manually.",
              ),
              React.createElement(BarRace, { a1results: d.a1results, a2results: d.a2results, comparison: d.comparison }),
            ),
          );
        }

                height: "100vh",
                color: C.dim,
                fontSize: 16,
                flexDirection: "column",
                gap: 12,
              },
            },
            React.createElement("div", {
              style: {
                width: 40,
                height: 40,
                border: "3px solid #334155",
                borderTopColor: "#DA7B42",
                borderRadius: "50%",

              },

            "Loading FIFA 2026 Climate Analysis...",
            React.createElement(
              "style",
              null,
              "@keyframes spin { to { transform: rotate(360deg); } }",

          "div",
          {
            style: {
              minHeight: "100vh",

              React.createElement(
                "h1",

                  style: {
                    fontSize: 17,

                },
                "FIFA 2026 Climate Analysis",

              React.createElement(
                "nav",
                { style: { display: "flex", gap: 0 } },
                tabs.map((t, i) =>
                  React.createElement(
                    "button",
                    {
                      key: i,

                        padding: "16px 18px",

                        borderBottom:
                          tab === i

          ),
          React.createElement(
            "main",

            React.createElement(ActiveTab, { data }),
          ),
          React.createElement(
            "footer",
            {
              style: {
                textAlign: "center",
                padding: "24px",
                color: C.mute,
                fontSize: 10,
                borderTop: `1px solid ${C.border}`,
              },
            },
            React.createElement("div", { style: { marginBottom: 8, color: C.text, fontSize: 12, fontWeight: 600 } }, "Chris Kersov"),
            React.createElement("a", { href: "https://github.com/chriskersov", target: "_blank", style: { color: C.coolL, textDecoration: "none" } }, "GitHub"),
            " | ",

          ),

      }

      ReactDOM.createRoot(document.getElementById("root")).render(

    </script>
